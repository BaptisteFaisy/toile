name: hermes-lite (gate)

# [HERMES-REFRESH] Gate « fraîcheur exigée au merge ».
# La logique complète vit dans .github/hermes/gate.py (stdlib seule).
# DRY-RUN : la variable de dépôt HERMES_LITE_DRY_RUN=1 est déjà posée —
# le gate observe, annote et alerte, mais NE FUSIONNE JAMAIS : Mergify
# (.mergify.yml) est le seul pilote de merge du dépôt.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de PR spécifique (vide = toutes les PR ouvertes)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  checks: write

# PIÈGE CONNU (RUNBOOK-NEW-REPO.md §5 : « PR figée UNSTABLE, Verdict=cancelled ») :
# avec UN groupe unique par dépôt/PR, chaque run `check_run` (completed) annule
# la run `pull_request` de la MÊME PR en vol ; le check requis reste alors
# `cancelled` et la PR gèle en UNSTABLE. On isole donc le groupe par
# event_name (+ numéro de PR, ou run_id pour check_run/workflow_dispatch qui
# n'en portent pas) : les runs d'événements différents ne se tuent plus.
concurrency:
  group: "hermes-lite-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.HERMES_LITE_TOKEN || github.token }}
  # Contexts de statut requis avant merge (CONTRACT §13 : la file Mergify
  # exige `ci` et `ci-budget`), séparés par des virgules.
  HERMES_REQUIRED_CHECKS: 'ci, ci-budget'
  MERGE_METHOD: rebase

jobs:
  gate:
    name: Verdict
    runs-on: [self-hosted, toile-worker]
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Préparer PATH (gh CLI du r630)
        run: |
          # PIÈGE RUNNER : /home/baptiste/bin N'EST PAS dans le PATH par défaut
          # du runner r630-toile-01 ; gh (2.103.3) y vit. gate.py en a besoin.
          if [ -d /home/baptiste/bin ]; then
            echo "/home/baptiste/bin" >> "$GITHUB_PATH"
          fi
          if [ ! -x /home/baptiste/bin/gh ]; then
            echo "::error::gh CLI introuvable (/home/baptiste/bin/gh absent ou non exécutable) : le gate ne peut pas interroger l'API GitHub."
            exit 1
          fi
          command -v python3 >/dev/null || { echo "::error::python3 absent du PATH du runner"; exit 1; }

      - name: Gate
        run: |
          export INPUT_PR_NUMBER="${{ github.event.inputs.pr_number }}"
          export HERMES_LITE_DRY_RUN="${{ vars.HERMES_LITE_DRY_RUN || '0' }}"
          python3 .github/hermes/gate.py

name: guest-e2e

# CI de bout en bout de l'invite QNX.
#
# L'invite ne se compile PAS ici : le SDP QNX 8.0 n'existe que sur le poste de
# travail. La CI telecharge une image IFS deja publiee (asset `toile-guest.ifs`
# d'une release du depot), la boot dans QEMU sur un runner **avec KVM**, et
# rejoue la preuve C : l'empreinte FNV-1a publiee par l'invite doit etre
# egale a l'empreinte recalculee sur les pixels rendus par l'emulateur.
#
# Ce qui est reellement verifie : le driver, le client et le transport
# fonctionnent dans un invite QNX 8.0 reel, et l'image affichee par
# l'emulateur est bien celle peinte par l'invite.
#
# Ce qui n'est PAS verifie : la compilation (fait sur le poste), et le chemin
# Screen (le display driver n'est pas demarre ici).
#
# Budget : verdict en moins de 5 minutes (regle CI-BUDGET-5MIN). Le runner
# doit avoir /dev/kvm : un runner GitHub heberge ne peut pas booter l'invite
# en 5 minutes (emulation logicielle trop lente).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'guest/**'
      - 'image/**'
      - 'qemu/**'
      - '.github/workflows/guest-e2e.yml'
  workflow_dispatch:
  schedule:
    # chaque nuit : la preuve C ne doit pas dependre d'une PR recente.
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: guest-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-e2e:
    name: guest-e2e (preuve C sur invite)
    runs-on: [self-hosted, toile-worker]
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verifier l'outillage du runner
        run: |
          # Le runner est un service systemd utilisateur : son PATH ne contient
          # pas toujours /usr/bin. On le fixe explicitement plutot que de
          # dependre de l'environnement du runner.
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/home/baptiste/bin:$PATH"
          command -v python3 >/dev/null || { echo "::error::python3 absent du runner"; exit 1; }
          # QEMU n'est pas toujours dans le PATH du runner : certains l'ont
          # en build portable dans ~/bin, sans lien dans /usr/bin.
          QEMU=""
          for c in "$(command -v qemu-system-x86_64 || true)" \
                   /usr/bin/qemu-system-x86_64 \
                   /home/baptiste/bin/qemu-system-x86_64 \
                   /home/baptiste/qemu-portable/bin/qemu-system-x86_64; do
            [ -x "$c" ] && QEMU="$c" && break
          done
          [ -n "$QEMU" ] || { echo "::error::qemu-system-x86_64 introuvable sur le runner"; exit 1; }
          echo "TOILE_QEMU=$QEMU" >> "$GITHUB_ENV"
          echo "qemu : $QEMU"
          "$QEMU" --version | head -1
          if [ ! -w /dev/kvm ]; then
            echo "::error::le runner n'a pas /dev/kvm : l invite ne bootera pas dans le budget de 5 min"
            exit 1
          fi

      - name: Telecharger l'image IFS publiee
        id: ifs
        env:
          # gh n est pas authentifie par defaut dans un job : sans ce jeton,
          # le telechargement echoue et la preuve etait sautee en silence.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ vars.GUEST_IFS_TAG || 'guest-ifs-latest' }}"
          DIR="$RUNNER_TEMP/toile-ifs"
          mkdir -p "$DIR"
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                 | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name']=='toile-guest.ifs'))" \
                 2>/dev/null || true)
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$DIR/toile-guest.ifs" "$URL"
            echo "ifs_path=$DIR/toile-guest.ifs" >> "$GITHUB_OUTPUT"
            echo "ifs_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "image IFS telechargee ($TAG) : $(stat -c %s "$DIR/toile-guest.ifs") octets"
          else
            echo "::warning::aucune release '$TAG' avec l'asset toile-guest.ifs : la preuve C est sautee (publier une image avec qemu/publish-ifs.sh)"
            echo "ifs_path=" >> "$GITHUB_OUTPUT"
            echo "ifs_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Rejouer la preuve C (invite -> emulateur)
        if: steps.ifs.outputs.ifs_path != ''
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/home/baptiste/bin:$PATH"
          chmod +x qemu/verify-hash.sh
          ./qemu/verify-hash.sh --ifs "${{ steps.ifs.outputs.ifs_path }}" --vnc 20

      - name: Verdict
        if: always()
        run: |
          if [ -z "${{ steps.ifs.outputs.ifs_path }}" ]; then
            echo "::warning::preuve C NON EXECUTEE (aucune image IFS publiee)"
            echo "### Preuve C : NON EXECUTEE" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucune image IFS publiee : la preuve C n a pas ete jouee." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Preuve C : EMPREINTES IDENTIQUES" >> "$GITHUB_STEP_SUMMARY"
          echo "L empreinte FNV-1a publiee par l invite est egale a celle recalculee sur les pixels rendus par QEMU." >> "$GITHUB_STEP_SUMMARY"
          echo "preuve C : empreintes de l invite et de l emulateur identiques"
